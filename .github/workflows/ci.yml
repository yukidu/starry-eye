name: Regression
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

concurrency:
  group: starry-eye-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: starry-eye-npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            starry-eye-npm-${{ runner.os }}-
      - run: npm install --prefer-offline --ignore-scripts
      - run: npm run verify
